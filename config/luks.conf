# =============================================================================
# config/luks.conf — Runtime LUKS encryption module configuration
#
# Loaded by harden.sh in addition to config/hardener.conf. The LUKS module is
# OPTIONAL and DISABLED by default; nothing is encrypted until LUKS_ENABLED=yes.
#
# Note: this file configures the RUNTIME hardening module (modules/20_luks.sh),
# which encrypts data/swap on an already-installed host. It is unrelated to
# luks/luks.conf, which configures the rescue-mode full-disk PROVISIONING
# system (luks/provision-encrypted.sh). See docs/LUKS.md.
# =============================================================================

# Master switch. The module does nothing (audit included reports only) unless
# this is "yes".
LUKS_ENABLED=no

# Deployment strategy.
#   auto       — detect bare-metal vs virtual at runtime (recommended)
#   bare-metal — force the bare-metal path (root FDE hardening, TPM2, dropbear)
#   virtual    — force the VPS path (data volumes only; never touches root/boot)
LUKS_MODE=auto

# -----------------------------------------------------------------------------
# Root volume (bare-metal only)
# -----------------------------------------------------------------------------
# If the root device is already LUKS, the module hardens it (header backup,
# key-slot policy, performance flags, optional TPM2 enrollment).
# If the root device is NOT encrypted and this is "yes", the module reports
# "needs user intervention" — in-place encryption of a mounted root is not
# possible; use luks/provision-encrypted.sh or the offline procedure in
# docs/LUKS.md. On VPSs this setting is ignored (root FDE is never attempted).
LUKS_ROOT_ENCRYPT=no

# -----------------------------------------------------------------------------
# TPM2 / Secure Boot (bare-metal only)
# -----------------------------------------------------------------------------
# Enroll the root LUKS volume for TPM2 auto-unlock via systemd-cryptenroll.
#   auto — enroll when a TPM2 device is present
#   yes  — require TPM2; fail the module if absent
#   no   — never enroll; passphrase + keyfile in /etc/luks/ only
LUKS_TPM2=auto

# PCR banks sealed into the TPM2 policy when Secure Boot is enabled.
# When Secure Boot is disabled, only PCR 7 is used (boot-path PCRs 0-3 churn
# on firmware/bootloader updates without SB enforcement and would brick
# auto-unlock).
LUKS_TPM2_PCRS="0+1+2+3+7"

# -----------------------------------------------------------------------------
# Cloud KMS key escrow (VPS focused; optional)
# -----------------------------------------------------------------------------
# Escrow LUKS keyfiles to a cloud KMS using the instance's IAM role/identity.
#   none — keys stay local only (default)
#   aws  — aws kms encrypt + S3/SSM   (requires aws CLI + instance role)
#   gcp  — gcloud kms encrypt + GCS   (requires gcloud + service account)
#   vault— HashiCorp Vault KV          (requires vault CLI + VAULT_ADDR)
LUKS_CLOUD_KMS_PROVIDER=none

# Provider-specific escrow locations (used when the matching provider is set).
LUKS_KMS_AWS_KEY_ID=""          # KMS key id/alias, e.g. alias/luks-escrow
LUKS_KMS_AWS_S3_BUCKET=""       # bucket for the encrypted keyfile blob
LUKS_KMS_GCP_KEYRING=""         # projects/.../keyRings/.../cryptoKeys/...
LUKS_KMS_GCP_BUCKET=""          # GCS bucket for the encrypted keyfile blob
LUKS_KMS_VAULT_PATH="secret/luks" # KV path prefix for keyfiles

# -----------------------------------------------------------------------------
# Network-Bound Disk Encryption (NBDE) — clevis + tang (opt-in)
# -----------------------------------------------------------------------------
# Automated unlock inside a trusted network. Only used when explicitly enabled
# AND the Tang server is reachable at apply time. A passphrase key slot is
# always retained as fallback.
LUKS_NBDE=no
LUKS_TANG_URL=""

# -----------------------------------------------------------------------------
# Data volumes
# -----------------------------------------------------------------------------
# Comma-separated list of block devices to encrypt as data volumes
# (e.g. "/dev/sdb,/dev/sdc"). Each device must pass the safety gate: not the
# root/boot/usr/var device, not active swap, no existing filesystem signature
# (unless LUKS_FORCE=yes), not referenced in fstab/crypttab.
# Leave empty to use a loopback container instead (VPS default).
LUKS_DATA_DEVICES=""

# Mount point for the encrypted data filesystem.
LUKS_DATA_PATH=/var/lib/encrypted-data

# Loopback container used when LUKS_DATA_DEVICES is empty.
LUKS_CONTAINER_FILE=/var/lib/luks/data.img
LUKS_CONTAINER_SIZE_MB=2048

# -----------------------------------------------------------------------------
# Swap
# -----------------------------------------------------------------------------
# Replace plaintext swap with dm-crypt swap keyed from /dev/urandom on every
# boot (no persistent key; swap contents are unrecoverable after poweroff).
LUKS_SWAP_ENCRYPT=yes

# Size of the encrypted swapfile created when no dedicated swap volume exists.
LUKS_SWAPFILE_SIZE_MB=1024

# -----------------------------------------------------------------------------
# Sensitive directory bind mounts (opt-in; understand the boot ordering risk)
# -----------------------------------------------------------------------------
# Relocate /etc/ssh and application secret dirs into the encrypted data
# filesystem and bind-mount them back. /etc/shadow is deliberately NOT
# relocated — PAM must read it before any unlock prompt can succeed.
# If the encrypted volume fails to unlock at boot, the bound services
# (e.g. sshd) will not start until recovered. Default off.
LUKS_BIND_SENSITIVE=no
LUKS_BIND_EXTRA_DIRS=""         # comma-separated extra dirs to relocate

# -----------------------------------------------------------------------------
# Remote unlock — dropbear in initramfs (bare-metal, Debian family, opt-in)
# -----------------------------------------------------------------------------
LUKS_DROPBEAR=no
LUKS_DROPBEAR_PORT=2222

# -----------------------------------------------------------------------------
# Cipher & key derivation
# -----------------------------------------------------------------------------
# "auto" benchmarks the CPU at apply time (cryptsetup benchmark) and picks the
# fastest of aes-xts-plain64 / serpent-xts-plain64 / xchacha20-adiantum —
# aes-xts wins on AES-NI hardware, adiantum on CPUs without it.
LUKS_CIPHER=auto
LUKS_KEY_SIZE=512
LUKS_PBKDF=argon2id
LUKS_PBKDF_MEMORY=1048576       # KiB
LUKS_PBKDF_ITERATIONS=4
LUKS_PBKDF_PARALLEL=4

# -----------------------------------------------------------------------------
# Header backups
# -----------------------------------------------------------------------------
# Primary location for GPG-encrypted LUKS header backups + SHA-512 checksums.
LUKS_HEADER_BACKUP_DIR=/var/backups/luks-headers

# Optional secondary location: an s3:// URI (VPS) or a mounted path such as a
# USB stick (bare-metal). Empty disables secondary replication.
LUKS_HEADER_BACKUP_SECONDARY=""

# -----------------------------------------------------------------------------
# Safety
# -----------------------------------------------------------------------------
# Allow formatting devices that carry an existing filesystem/RAID/LVM
# signature. Leave "no" unless you are certain the device is disposable.
LUKS_FORCE=no
